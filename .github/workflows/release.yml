name: Release VSIX
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.90.0', '1.143.1']
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify tag matches package version
        run: node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Version mismatch")'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run package
      - run: npm run test:native
      - run: xvfb-run -a npm run test:extension
      - run: xvfb-run -a npm run test:multiwindow
      - run: xvfb-run -a npm run test:multiwindow
        env:
          OPENCODE_NOTIFY_SMOKE_PROFILES: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode }}
          path: artifacts/
