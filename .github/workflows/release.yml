name: Release VSIX
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify tag matches package version
        run: node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Version mismatch")'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run package
      - run: npm run test:native
      - run: xvfb-run -a npm run test:extension
      - name: Publish VSIX release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.vsix artifacts/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
